name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          VERSION_STR=$(java -version 2>&1 | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$VERSION_STR" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi
          MAJOR_VERSION=$(printf '%s' "$VERSION_STR" | awk -F. '{if ($1 == "1") print $2; else print $1}' | sed 's/[^0-9].*//')
          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 0 ] 2>/dev/null; then
            echo "::error::Failed to parse Java major version from '$VERSION_STR'."
            exit 1
          fi
          echo "Active Java major version: ${MAJOR_VERSION} (${VERSION_STR})"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in configured Java 17 installation at '${KEYTOOL_BIN}'."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null
            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created at ./debug.keystore."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK missing at ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Unexpected APK path: ${EXPECTED_APK}"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^[-.]*//; s/[-.]*$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          RELEASE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset.XXXXXX")
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_FILENAME}"

          cp "$EXPECTED_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty at ${ASSET_PATH}."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not preserve .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          echo "Prepared release asset: ${ASSET_FILENAME}"
          {
            echo "release_asset_path=${ASSET_PATH}"
            echo "release_asset_name=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh --version; then
            echo "::error::GitHub CLI (gh) is unavailable."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.release_asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.release_asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK asset is missing or empty: ${ASSET_PATH}"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset is not an .apk file: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Asset Filename:** ${ASSET_NAME}

          > **Testing Notice:** This APK is intended for testing only. It is **not** a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          UPLOAD_OUTCOME="${{ steps.upload_artifact.outcome }}"
          PREP_OUTCOME="${{ steps.prepare_release_asset.outcome }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$UPLOAD_OUTCOME" = "success" ] && [ "$PREP_OUTCOME" = "success" ]; then
            if [ "$PUBLISH_OUTCOME" = "success" ]; then
              RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
              RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
              ASSET_NAME="${{ steps.prepare_release_asset.outputs.release_asset_name }}"
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')

              echo "Confirmed GitHub Release:"
              gh release view "$RELEASE_TAG" --json tagName,name,url,assets
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release Page URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** Debug APK build, Actions artifact upload, and GitHub Release publishing all succeeded."
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page."
                echo "The GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload ('app-debug-apk') succeeded."
              {
                echo "## Debug APK Build Summary (Release Warning)"
                echo ""
                echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
                echo ""
                echo "- **APK Build:** Succeeded"
                echo "- **Actions Artifact:** Available as \`app-debug-apk\` on this workflow run"
                echo ""
                echo "Download the debug APK from the \`app-debug-apk\` artifact in the workflow run summary."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## Debug APK Build Summary"
              echo ""
              echo "- **Build / Artifact Status:** Did not complete successfully (artifact outcome: \`${UPLOAD_OUTCOME}\`, asset prep outcome: \`${PREP_OUTCOME}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
